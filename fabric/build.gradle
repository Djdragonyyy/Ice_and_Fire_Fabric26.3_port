plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'com.github.alexthe666.iceandfire'
base { archivesName = 'iceandfire-fabric-26.3' }

loom {
    splitEnvironmentSourceSets()
    mods {
        iceandfire {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Integration tests run with Fabric's real registries, outside the distributable mod JAR.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
loom {
    mods {
        iceandfire_gametest { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            source sourceSets.gametest
            runDir 'run/0.1.37-gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${file('build/gametest-results.xml').absolutePath}"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
sourceSets.test {
    compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
    runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
}
test {
    useJUnitPlatform()
    dependsOn tasks.named('clientClasses')
    systemProperty 'iceandfire.legacyResources', file('../src/main/resources').absolutePath
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from('../src/main/resources') {
        include 'assets/iceandfire/models/tabula/firedragon/**'
        include 'assets/iceandfire/textures/models/firedragon/**'
        include 'assets/iceandfire/sounds/mobs/dragon/fire/*.ogg'
        include 'assets/iceandfire/sounds/mobs/dragon/flight_*.ogg'
        include 'data/iceandfire/damage_type/dragon_fire.json'
        include 'assets/iceandfire/blockstates/chared_*.json', 'assets/iceandfire/blockstates/ash.json'
        include 'assets/iceandfire/models/block/chared_*.json', 'assets/iceandfire/models/block/ash.json'
        include 'assets/iceandfire/models/item/chared_*.json', 'assets/iceandfire/models/item/ash.json'
        include 'assets/iceandfire/textures/block/chared_*.png', 'assets/iceandfire/textures/block/ash.png'
        include 'assets/iceandfire/models/item/dragonarmor_*.json', 'assets/iceandfire/textures/item/dragonarmor_*.png'
        include 'assets/iceandfire/textures/gui/dragon.png'
        include 'assets/iceandfire/textures/item/dragon_meal.png'
        include 'assets/iceandfire/textures/item/sickly_dragon_meal.png', 'assets/iceandfire/textures/item/creative_dragon_meal.png'
        include 'assets/iceandfire/textures/item/dragon_stick.png'
        include 'assets/iceandfire/textures/item/dragon_horn.png', 'assets/iceandfire/textures/item/dragon_horn_fire.png'
        include 'assets/iceandfire/models/item/dragon_horn.json', 'assets/iceandfire/models/item/dragon_horn_fire.json'
        include 'assets/iceandfire/models/item/dragon_flute.json', 'assets/iceandfire/textures/item/dragon_flute.png'
        include 'assets/iceandfire/sounds/items/dragon_flute.ogg'
        include 'assets/iceandfire/models/item/summoning_crystal_fire*.json'
        include 'assets/iceandfire/textures/item/summon_crystal_fire*.png'
        include 'assets/iceandfire/models/item/sickly_dragon_meal.json', 'assets/iceandfire/models/item/creative_dragon_meal.json'
        include 'assets/iceandfire/models/item/dragon_stick.json'
        include 'assets/iceandfire/models/item/fire_stew.json', 'assets/iceandfire/textures/item/fire_stew.png'
        include 'assets/iceandfire/blockstates/nest.json', 'assets/iceandfire/models/block/nest.json'
        include 'assets/iceandfire/models/item/nest.json', 'assets/iceandfire/textures/block/nest.png'
        include 'assets/iceandfire/textures/item/dragonegg_red.png'
        include 'assets/iceandfire/textures/item/dragonegg_green.png'
        include 'assets/iceandfire/textures/item/dragonegg_bronze.png'
        include 'assets/iceandfire/textures/item/dragonegg_gray.png'
    }
    from('../src/main/resources/assets/iceandfire/textures/particles') {
        include 'flame.png'
        into 'assets/iceandfire/textures/particle'
    }
}
jar { from('../LICENSE') { rename { 'LICENSE_iceandfire' } } }

// Graphics regression probes run in a separate client-only test mod, never in the shipped JAR.
sourceSets {
    clientGametest {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}
loom {
    mods { iceandfire_client_gametest { sourceSet sourceSets.clientGametest } }
    runs {
        clientGametest {
            client()
            source sourceSets.clientGametest
            runDir 'run/0.1.37-client-gametest'
            vmArg '-Dfabric.client.gametest'
        }
    }
}

// Explicit opt-in: independent network test processes, never part of the distributed mod.
if (providers.gradleProperty('iafNetworkTest').isPresent()) {
    def networkDirectory = file(providers.gradleProperty('iafNetworkDir').getOrElse('build/network-test-session')).absolutePath
    def networkPort = providers.gradleProperty('iafNetworkPort').getOrElse('25595')
    sourceSets {
        networkServerGametest {
            java.srcDir 'src/networkTestSupport/java'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
        networkClientGametest {
            java.srcDir 'src/networkTestSupport/java'
            compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
            runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
        }
    }
    tasks.named('processNetworkServerGametestResources') {
        from('src/gametest/resources') { include 'data/iceandfire/gametest/structure/**' }
    }
    loom {
        mods {
            iceandfire_network_gametest { sourceSet sourceSets.networkServerGametest }
            iceandfire_network_client_gametest { sourceSet sourceSets.networkClientGametest }
        }
        runs {
            networkServerGametest {
                server()
                source sourceSets.networkServerGametest
                runDir 'run/0.1.35-network-server'
                vmArg '-Xmx1G'
                vmArg '-Dfabric-api.gametest'
                vmArg '-Dfabric-api.gametest.filter=iceandfire_network_gametest:*'
                vmArg "-Dfabric-api.gametest.report-file=${file('build/network-gametest-results.xml').absolutePath}"
                vmArg "-Diaf.network.dir=${networkDirectory}"
                vmArg "-Diaf.network.port=${networkPort}"
            }
            networkOwnerGametest {
                client()
                source sourceSets.networkClientGametest
                runDir 'run/0.1.35-network-owner'
                vmArg '-Xmx2G'
                vmArg '-Dfabric.client.gametest'
                vmArg '-Diaf.network.role=owner'
                vmArg "-Diaf.network.dir=${networkDirectory}"
                vmArg "-Diaf.network.port=${networkPort}"
                programArg '--username'
                programArg 'PortTestOwner'
            }
            networkGuestGametest {
                client()
                source sourceSets.networkClientGametest
                runDir 'run/0.1.35-network-guest'
                vmArg '-Xmx2G'
                vmArg '-Dfabric.client.gametest'
                vmArg '-Diaf.network.role=guest'
                vmArg "-Diaf.network.dir=${networkDirectory}"
                vmArg "-Diaf.network.port=${networkPort}"
                programArg '--username'
                programArg 'PortTestGuest'
            }
        }
    }
}
