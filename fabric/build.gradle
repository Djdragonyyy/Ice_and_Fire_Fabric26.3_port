plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'com.github.alexthe666.iceandfire'
base { archivesName = 'iceandfire-fabric-26.3' }

loom {
    splitEnvironmentSourceSets()
    mods {
        iceandfire {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
sourceSets.test {
    compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
    runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
}
test {
    useJUnitPlatform()
    dependsOn tasks.named('clientClasses')
    systemProperty 'iceandfire.legacyResources', file('../src/main/resources').absolutePath
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from('../src/main/resources') {
        include 'assets/iceandfire/models/tabula/firedragon/**'
        include 'assets/iceandfire/textures/models/firedragon/**'
        include 'assets/iceandfire/sounds/mobs/dragon/fire/breath.ogg'
        include 'data/iceandfire/damage_type/dragon_fire.json'
        include 'assets/iceandfire/textures/item/dragon_meal.png'
        include 'assets/iceandfire/textures/item/dragonegg_red.png'
        include 'assets/iceandfire/textures/item/dragonegg_green.png'
        include 'assets/iceandfire/textures/item/dragonegg_bronze.png'
        include 'assets/iceandfire/textures/item/dragonegg_gray.png'
    }
}
jar { from('../LICENSE') { rename { 'LICENSE_iceandfire' } } }
