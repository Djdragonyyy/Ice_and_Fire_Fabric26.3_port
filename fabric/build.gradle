plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'com.github.alexthe666.iceandfire'
base { archivesName = 'iceandfire-fabric-26.3' }

loom {
    splitEnvironmentSourceSets()
    mods {
        iceandfire {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Integration tests run with Fabric's real registries, outside the distributable mod JAR.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
loom {
    mods {
        iceandfire_gametest { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            source sourceSets.gametest
            runDir 'run/0.1.25-gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${file('build/gametest-results.xml').absolutePath}"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
sourceSets.test {
    compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
    runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
}
test {
    useJUnitPlatform()
    dependsOn tasks.named('clientClasses')
    systemProperty 'iceandfire.legacyResources', file('../src/main/resources').absolutePath
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from('../src/main/resources') {
        include 'assets/iceandfire/models/tabula/firedragon/**'
        include 'assets/iceandfire/textures/models/firedragon/**'
        include 'assets/iceandfire/sounds/mobs/dragon/fire/*.ogg'
        include 'data/iceandfire/damage_type/dragon_fire.json'
        include 'assets/iceandfire/blockstates/chared_*.json', 'assets/iceandfire/blockstates/ash.json'
        include 'assets/iceandfire/models/block/chared_*.json', 'assets/iceandfire/models/block/ash.json'
        include 'assets/iceandfire/models/item/chared_*.json', 'assets/iceandfire/models/item/ash.json'
        include 'assets/iceandfire/textures/block/chared_*.png', 'assets/iceandfire/textures/block/ash.png'
        include 'assets/iceandfire/models/item/dragonarmor_*.json', 'assets/iceandfire/textures/item/dragonarmor_*.png'
        include 'assets/iceandfire/textures/gui/dragon.png'
        include 'assets/iceandfire/textures/item/dragon_meal.png'
        include 'assets/iceandfire/textures/item/sickly_dragon_meal.png', 'assets/iceandfire/textures/item/creative_dragon_meal.png'
        include 'assets/iceandfire/textures/item/dragon_stick.png'
        include 'assets/iceandfire/models/item/sickly_dragon_meal.json', 'assets/iceandfire/models/item/creative_dragon_meal.json'
        include 'assets/iceandfire/models/item/dragon_stick.json'
        include 'assets/iceandfire/models/item/fire_stew.json', 'assets/iceandfire/textures/item/fire_stew.png'
        include 'assets/iceandfire/blockstates/nest.json', 'assets/iceandfire/models/block/nest.json'
        include 'assets/iceandfire/models/item/nest.json', 'assets/iceandfire/textures/block/nest.png'
        include 'assets/iceandfire/textures/item/dragonegg_red.png'
        include 'assets/iceandfire/textures/item/dragonegg_green.png'
        include 'assets/iceandfire/textures/item/dragonegg_bronze.png'
        include 'assets/iceandfire/textures/item/dragonegg_gray.png'
    }
    from('../src/main/resources/assets/iceandfire/textures/particles') {
        include 'flame.png'
        into 'assets/iceandfire/textures/particle'
    }
}
jar { from('../LICENSE') { rename { 'LICENSE_iceandfire' } } }

// Graphics regression probes run in a separate client-only test mod, never in the shipped JAR.
sourceSets {
    clientGametest {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}
loom {
    mods { iceandfire_client_gametest { sourceSet sourceSets.clientGametest } }
    runs {
        clientGametest {
            client()
            source sourceSets.clientGametest
            runDir 'run/0.1.25-client-gametest'
            vmArg '-Dfabric.client.gametest'
        }
    }
}
